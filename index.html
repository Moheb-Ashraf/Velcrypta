<!doctype html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ═══ PRIMARY SEO ═══ -->
  <title>Velcrypta — Uncover the Hidden. Fear the Unknown.</title>
  <meta name="title" content="Velcrypta — Uncover the Hidden. Fear the Unknown." />
  <meta name="description" content="Velcrypta is a dark mystery storytelling platform. Explore horror stories, unsolved mysteries, true crime cases, Dyatlov Pass, Flight 19, supernatural phenomena, and dark conspiracy theories." />
  <meta name="keywords" content="mystery stories, unsolved mysteries, horror stories, true crime, dark theories, Dyatlov Pass incident, Flight 19 disappearance, supernatural stories, conspiracy theories, unexplained phenomena, dark storytelling, horror reading, mystery blog, crime stories, paranormal, velcrypta" />
  <meta name="author" content="Velcrypta" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />
  <link rel="canonical" href="https://www.velcrypta.com/" />

  <!-- ═══ OPEN GRAPH / FACEBOOK ═══ -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Velcrypta" />
  <meta property="og:title" content="Velcrypta — Uncover the Hidden. Fear the Unknown." />
  <meta property="og:description" content="Dark mystery storytelling. Horror, unsolved cases, true crime, and truths that refuse to stay buried. Enter if you dare." />
  <meta property="og:url" content="https://www.velcrypta.com/" />
  <meta property="og:image" content="https://www.velcrypta.com/velcrypta-logo.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Velcrypta — Dark Mystery Storytelling Platform" />
  <meta property="og:locale" content="en_US" />

  <!-- ═══ TWITTER CARD ═══ -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@velcrypta" />
  <meta name="twitter:creator" content="@velcrypta" />
  <meta name="twitter:title" content="Velcrypta — Uncover the Hidden. Fear the Unknown." />
  <meta name="twitter:description" content="Dark mystery storytelling. Horror, unsolved cases, true crime, and truths that refuse to stay buried." />
  <meta name="twitter:image" content="https://www.velcrypta.com/velcrypta-logo.jpg" />

  <!-- ═══ STRUCTURED DATA — WebSite + Organization ═══ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.velcrypta.com/#website",
        "url": "https://www.velcrypta.com/",
        "name": "Velcrypta",
        "description": "Dark mystery storytelling platform — horror, unsolved mysteries, true crime, and hidden truths.",
        "publisher": { "@id": "https://www.velcrypta.com/#organization" },
        "potentialAction": {
          "@type": "SearchAction",
          "target": { "@type": "EntryPoint", "urlTemplate": "https://www.velcrypta.com/stories?q={search_term_string}" },
          "query-input": "required name=search_term_string"
        },
        "inLanguage": "en-US"
      },
      {
        "@type": "Organization",
        "@id": "https://www.velcrypta.com/#organization",
        "name": "Velcrypta",
        "url": "https://www.velcrypta.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://www.velcrypta.com/velcrypta-logo.jpg",
          "width": 512,
          "height": 512
        },
        "sameAs": [],
        "description": "Dark mystery storytelling platform covering horror, unsolved mysteries, true crime, and paranormal phenomena."
      },
      {
        "@type": "Blog",
        "@id": "https://www.velcrypta.com/#blog",
        "name": "Velcrypta Stories",
        "url": "https://www.velcrypta.com/stories",
        "description": "A curated collection of the world's most disturbing unsolved mysteries, horror stories, and true crime accounts.",
        "publisher": { "@id": "https://www.velcrypta.com/#organization" },
        "inLanguage": "en-US"
      }
    ]
  }
  </script>
